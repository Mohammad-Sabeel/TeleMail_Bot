<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>TeleMail</title>
  <!-- Mail that cannot be talked into anything: an envelope behind a gate. -->
  <rect width="512" height="512" rx="112" fill="#0E6C76"/>

  <!-- envelope -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="112" y="152" width="288" height="208" rx="26"/>
    <path d="M112 176 L256 280 L400 176"/>
  </g>

  <!-- the enforcement boundary, sealing the lower right -->
  <g transform="translate(366,346)">
    <path d="M0 -62 L52 -42 L52 6 C52 44 28 68 0 78 C-28 68 -52 44 -52 6 L-52 -42 Z"
          fill="#D6A544" stroke="#0E6C76" stroke-width="20" stroke-linejoin="round"/>
    <path d="M-22 4 L-6 22 L24 -18" fill="none" stroke="#0E6C76"
          stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
